<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Church Services</title>

    <link rel="stylesheet" href="style4ass.css">
</head>

<body>

    <!-- Top Header -->
    <header class="top-header">
        <h3>WELCOME TO CHURCH</h3>
    </header>


    <!-- Services Section -->
    <section class="services">

        <!-- Wednesday -->
        <div class="service-card wednesday">
            <div class="overlay">
                <h2>Wednesday</h2>
                <h3>5:30PM</h3>
            </div>
        </div>


        <!-- Sunday -->
        <div class="service-card sunday">
            <div class="overlay">
                <h2>Sunday</h2>
                <h3>8:30PM</h3>
            </div>
        </div>


        <!-- Counseling -->
        <div class="service-card counseling">
            <div class="overlay">
                <h2>Counseling</h2>
                <h3>4:30PM</h3>
            </div>
        </div>


        <!-- Youth -->
        <div class="service-card youth">
            <div class="overlay">
                <h2>Youth</h2>
                <p>CONNECT</p>
            </div>
        </div>


        <!-- Giving -->
        <div class="service-card giving">
            <div class="overlay">
                <h2>Giving</h2>
                <p>DONATE</p>
            </div>
        </div>

    </section>

</body>
</html>
